apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service-node
  labels:
    app: reporting-service-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting-service-node
  template:
    metadata:
      labels:
        app: reporting-service-node
    spec:
      initContainers:
        - name: reporting-migrate
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - "npx sequelize-cli db:migrate"
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: reporting-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: reporting-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: reporting-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reporting-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: reporting-db
                  key: name
      containers:
        - name: reporting-service
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          ports:
            - containerPort: 3019
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3019"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: reporting-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: reporting-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: reporting-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reporting-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: reporting-db
                  key: name
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: reporting-rabbitmq
                  key: url
            - name: CORS_ORIGIN
              value: "https://crm.noahsolution.com"
            - name: INTERNAL_USER_ID
              value: "00000000-0000-0000-0000-000000000000"
            # Contabilidad (server-to-server): plan de cuentas y balance de comprobación, para conciliar el anexo con el mayor.
            - name: ACCOUNTING_SERVICE_URL
              value: "http://accounting-service-node:3016"
            # Organización (server-to-server): razón social y RUC del informante del ATS.
            - name: ORGANIZATION_SERVICE_URL
              value: "http://organization-service:3002"
            - name: ORG_TIMEZONE
              value: "America/Guayaquil"
            - name: OTEL_SERVICE_NAME
              value: "reporting-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            # Sin `limits` a propósito: un tope de CPU estrangulaba al servicio y las pruebas medían el límite de
            # Kubernetes, no la capacidad del código. Se conservan los `requests` (reserva).
          livenessProbe:
            httpGet:
              path: /health
              port: 3019
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3019
            initialDelaySeconds: 5
            periodSeconds: 10
